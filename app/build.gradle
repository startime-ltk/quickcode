plugins {
    id 'com.android.application'
}

// 正式签名配置：口令写在文件里仅用于本机个人项目。
// quickcode-release.jks 一旦丢失，以后无法给 App 做升级覆盖安装，请务必备份。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.litukang.quickcode'
    // 本机 SDK 装的是 API 36（D:\Android\Sdk\platforms\android-36），故 compileSdk 用 36
    compileSdk 36

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.litukang.quickcode"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.4"

        // 本 App 是纯原生代码，没有 .so 库，单架构过滤对体积影响不大，
        // 但保留这一行可避免将来引入依赖时误打包多架构。
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无第三方依赖，纯 Android SDK 原生实现，APK 体积极小
}
